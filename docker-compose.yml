version: "3.9"

services:
  demo:
    build: .
    profiles: ["demo"]
    ports:
      - "8000:8000"
    environment:
      APOLLO_EMBEDDING: hash
      APOLLO_LLM_MODE: dry-run

  prod:
    build: .
    profiles: ["prod"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APOLLO_EMBEDDING: bge
      APOLLO_LLM_MODE: openai
